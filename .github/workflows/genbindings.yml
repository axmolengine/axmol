name: genbindings

on:
  push:
    branches:
      - dev
      - release/*
    paths-ignore:
      - '**.md'
      - '**/*.md.in'
      - 'docs/**'
      - '.github/workflows/publish.yml'
      - '.github/workflows/debian.yml'

  workflow_dispatch:

  pull_request:
    paths:
      - 'tools/bindings-generator/**'
      - 'tools/lua-bindings/**'
      - 'extensions/scripting/lua-bindings/**'
      - 'axmol/**'
      - '.github/workflows/genbindings.yml'

jobs:
  verify:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6

    - name: Regenerate bindings
      run: tools\cmdline\plugins\genbindings.ps1

    - name: Require checked-in output
      shell: pwsh
      run: |
        git diff --check
        git diff --exit-code -- extensions/scripting/lua-bindings/generated

  genbindings:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6

    - name: Genbindings
      run: tools\cmdline\plugins\genbindings.ps1

    - name: Detect generated changes
      id: bindings
      shell: pwsh
      run: |
        "commit=${{ github.sha }}" >> $env:GITHUB_OUTPUT
        if (git diff --quiet -- extensions/scripting/lua-bindings/generated) {
          "changed=false" >> $env:GITHUB_OUTPUT
        } else {
          "changed=true" >> $env:GITHUB_OUTPUT
        }

    - name: Create pull request
      if: ${{ steps.bindings.outputs.changed == 'true' }}
      id: cpr
      uses: peter-evans/create-pull-request@v8
      with:
        token: ${{ secrets.AX_BOT_TOKEN }}
        push-to-fork: axmol-bot/axmol
        commit-message: Committing luabindings for commit ${{ steps.bindings.outputs.commit }}
        signoff: false
        branch: luabindings_for_${{ steps.bindings.outputs.commit }}
        delete-branch: true
        title: 'Committing luabindings for commit ${{ steps.bindings.outputs.commit }}'
        body: |
          RT
          - Auto-generated by [create-pull-request][1]

          [1]: https://github.com/peter-evans/create-pull-request
        labels: |
          lua-bindings
          automated pr
          pinned
        assignees: axmol-bot
        reviewers: halx99
        draft: false

    - name: Check outputs
      if: ${{ steps.cpr.outputs.pull-request-number }}
      run: |
        echo "Pull Request Number - ${{ steps.cpr.outputs.pull-request-number }}"
        echo "Pull Request URL - ${{ steps.cpr.outputs.pull-request-url }}"
